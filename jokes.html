<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Jokes</title>

    <style>
        body { font-family: Arial, sans-serif; background: #e8f5e9; margin: 0; }
        header { background: green; padding: 20px; color: white; text-align: center; }
        nav { background: #2c3e50; padding: 15px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-size: 20px; }
        nav a:hover { color: #e74c3c; }
        section { background: white; width: 80%; margin: 30px auto; padding: 25px;
                  border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        button { padding: 10px 20px; font-size: 18px; border-radius: 8px;
                 cursor: pointer; background: green; color: white; }
        .box { padding: 20px; border: 2px solid #444; border-radius: 12px; }
    </style>
</head>

<body>

<header>
    <h1>Random Jokes</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="jokes.html">Random Jokes</a>
    <a href="dictionary.html">Dictionary</a>
    <a href="contact.html">Contact</a>
</nav>

<section>
    <h2>Make Someone Laugh 😂</h2>

    <div class="box">
        <div id="joke">Click the button for a joke!</div><br>
        <button onclick="newJoke()">Get Joke</button>
    </div>
</section>

<script>
    const jokes = [
        "Why don’t skeletons fight each other? They don’t have the guts.",
        "I tried to catch some fog yesterday… I mist.",
        "Why did the math book look sad? It had too many problems.",
        "What do you call cheese that isn’t yours? Nacho cheese.",
        "Why couldn’t the bicycle stand up by itself? It was two-tired."
    ];

    function newJoke() {
        document.getElementById("joke").innerText =
            jokes[Math.floor(Math.random() * jokes.length)];
    }
</script>

</body>
</html>
